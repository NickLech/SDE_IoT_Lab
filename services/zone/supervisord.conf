; One zone = one container = six independent processes (one per device).
; ZONE / ZONE_INDEX come from the container environment (%(ENV_ZONE)s).
; Control from a terminal:  zonectl status | stop soil-2 | start soil-2 | restart sprinkler ...

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:soil-1]
user=sensor
command=python /app/soil/app.py
environment=SENSOR_INDEX="1"
autorestart=unexpected
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:soil-2]
user=sensor
command=python /app/soil/app.py
environment=SENSOR_INDEX="2"
autorestart=unexpected
