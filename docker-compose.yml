# Un container per zona (zone1..zone3): soil-1..3, temperature, humidity, sprinkler.
# Pioggia globale (rain). Controllo dei singoli dispositivi: ./ctl.sh (vedi README).
x-zone: &zone
  build:
    context: .
    dockerfile: services/zone/Dockerfile
  depends_on:
    broker:
      condition: service_healthy
  restart: unless-stopped

services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./services/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 30s
      start_period: 20s
      start_interval: 2s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---- zone: 3 soil + temperature (HTTP :5001) + humidity (HTTP :5002) + sprinkler ----
  # Porte host per il debug: zone1 5001/5002, zone2 5011/5012, zone3 5021/5022
  zone1:
    <<: *zone
    environment:
      MQTT_HOST: broker
      ZONE: zone1
      ZONE_INDEX: "0"
      NOISE_STD: "0.4"      # come nel compose originale (letto solo se il servizio temperature lo supporta)
      SPIKE_PROB: "0.02"
    ports:
      - "5001:5001"
      - "5002:5002"

  zone2:
    <<: *zone
    environment:
      MQTT_HOST: broker
      ZONE: zone2
      ZONE_INDEX: "1"
      NOISE_STD: "0.4"
      SPIKE_PROB: "0.02"
    ports:
      - "5011:5001"
      - "5012:5002"

  zone3:
    <<: *zone
    environment:
      MQTT_HOST: broker
      ZONE: zone3
      ZONE_INDEX: "2"
      NOISE_STD: "0.4"
      SPIKE_PROB: "0.02"
    ports:
      - "5021:5001"
      - "5022:5002"

  # ---- pioggia globale ----
  rain:
    build: ./services/rain
    environment:
      MQTT_HOST: broker
      RAIN_MIN_S: "120"
      RAIN_MAX_S: "300"
      RAIN_DURATION_S: "30"
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  # Prints every field message: docker compose --profile debug up monitor
  monitor:
    image: eclipse-mosquitto:2
    profiles: ["debug"]
    command: ["mosquitto_sub", "-h", "broker", "-t", "field/#", "-t", "debug/#", "-v"]
    depends_on:
      broker:
        condition: service_healthy

  # Field view + MQTT log: http://localhost:8050
  dashboard:
    build: ./services/dashboard
    environment:
      MQTT_HOST: broker
      ZONES: "zone1,zone2,zone3"
      SENSORS_PER_ZONE: "3"
      LOG_TOPICS: "field/#,debug/#"
      CENTRAL_URL: http://central:5000      # all the data (soil, VPD, decisions) comes from central
    ports:
      - "8050:8050"
    depends_on:
      broker:
        condition: service_healthy
      central:
        condition: service_healthy
    restart: unless-stopped

  # Central node: soil fusion + air (HTTP pull) -> VPD -> irrigation decision; serves GET /zones to the dashboard
  central:
    build: ./services/central
    environment:
      MQTT_HOST: broker
      ZONES: "zone1,zone2,zone3"
      SENSORS_PER_ZONE: "3"
      # one temperature + one humidity sensor per zone container: {zone} -> zone1, zone2, zone3
      TEMPERATURE_URL: "http://{zone}:5001"
      HUMIDITY_URL: "http://{zone}:5002"
      POLL_INTERVAL_S: "5"
    ports:
      - "5100:5000"      # host 5100 -> container 5000 (macOS AirPlay already owns host 5000)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      start_period: 10s
      start_interval: 2s
      timeout: 3s
      retries: 3
    depends_on:
      broker:
        condition: service_healthy
      zone1:
        condition: service_started
      zone2:
        condition: service_started
      zone3:
        condition: service_started
    restart: unless-stopped
