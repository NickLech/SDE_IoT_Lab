services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./services/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 30s
      start_period: 20s
      start_interval: 2s   # fast checks at startup (needs Docker Engine 25+)
      timeout: 5s
      retries: 3
    restart: unless-stopped

  soil:
    build: ./services/soil
    environment:
      MQTT_HOST: broker
      ZONES: "zone1,zone2,zone3"
      SENSORS_PER_ZONE: "3"
      PUBLISH_INTERVAL_S: "2"
      NOISE_STD: "0.8"
      SPIKE_PROB: "0.03"
      TIME_SCALE: "${TIME_SCALE:-1}"   # e.g. TIME_SCALE=8 docker compose up, for the smoke test
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  sprinkler:
    build: ./services/sprinkler
    environment:
      MQTT_HOST: broker
      ZONES: "zone1,zone2,zone3"
      DEFAULT_DURATION_S: "30"
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  # Prints every field message: docker compose --profile debug up monitor
  monitor:
    image: eclipse-mosquitto:2
    profiles: ["debug"]
    command: ["mosquitto_sub", "-h", "broker", "-t", "field/#", "-t", "debug/#", "-v"]
    depends_on:
      broker:
        condition: service_healthy

  # HTTP sensor (pull): http://localhost:5002/zones/zone1/humidity
  humidity:
    build: ./services/humidity
    environment:
      ZONES: "zone1,zone2,zone3"
      NOISE_STD: "1.5"
      SPIKE_PROB: "0.02"
      DAY_PERIOD_S: "600"   # keep equal to the temperature service
    ports:
      - "5002:5002"
    restart: unless-stopped

  # Field view + MQTT log: http://localhost:8050
  dashboard:
    build: ./services/dashboard
    environment:
      MQTT_HOST: broker
      ZONES: "zone1,zone2,zone3"
      SENSORS_PER_ZONE: "3"
      LOG_TOPICS: "field/#,debug/#"
    ports:
      - "8050:8050"
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------- to be implemented
  temperature:
    profiles: ["wip"]
    build: ./services/temperature
    environment:
      NOISE_STD: "0.4"
      SPIKE_PROB: "0.02"
    ports:
      - "5001:5001"

  central:
    profiles: ["wip"]
    build: ./services/central
    environment:
      MQTT_HOST: broker
      TEMPERATURE_URL: http://temperature:5001
      HUMIDITY_URL: http://humidity:5002
      POLL_INTERVAL_S: "5"
    ports:
      - "5000:5000"
    depends_on:
      broker:
        condition: service_healthy
      temperature:
        condition: service_started
      humidity:
        condition: service_started
