services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./services/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  temperature:
    build: ./services/temperature
    environment:
      NOISE_STD: "0.4"
      SPIKE_PROB: "0.02"
    ports:
      - "5001:5001"

  humidity:
    build: ./services/humidity
    environment:
      NOISE_STD: "1.5"
      SPIKE_PROB: "0.02"
    ports:
      - "5002:5002"

  soil:
    build: ./services/soil
    environment:
      MQTT_HOST: broker
      NOISE_STD: "0.8"
      SPIKE_PROB: "0.03"
    depends_on:
      - broker

  sprinkler:
    build: ./services/sprinkler
    environment:
      MQTT_HOST: broker
    depends_on:
      - broker

  central:
    build: ./services/central
    environment:
      MQTT_HOST: broker
      TEMPERATURE_URL: http://temperature:5001
      HUMIDITY_URL: http://humidity:5002
      POLL_INTERVAL_S: "5"
    ports:
      - "5000:5000"
    depends_on:
      - broker
      - temperature
      - humidity

  dashboard:
    build: ./services/dashboard
    environment:
      CENTRAL_URL: http://central:5000
    ports:
      - "8050:8050"
    depends_on:
      - central
