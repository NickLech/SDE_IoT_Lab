services:
  broker:
    image: eclipse-mosquitto:2
    volumes:
      - ./services/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 30s
      start_period: 20s
      start_interval: 2s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  soil:
    build: ./services/soil
    environment:
      MQTT_HOST: broker
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  sprinkler:
    build: ./services/sprinkler
    environment:
      MQTT_HOST: broker
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  rain:
    build: ./services/rain
    environment:
      MQTT_HOST: broker
      RAIN_MIN_S: "120"
      RAIN_MAX_S: "300"
      RAIN_DURATION_S: "30"
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  humidity:
    build: ./services/humidity
    environment:
      MQTT_HOST: broker
    ports:
      - "5002:5002"
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  # Prints every field message: docker compose --profile debug up monitor
  monitor:
    image: eclipse-mosquitto:2
    profiles: ["debug"]
    command: ["mosquitto_sub", "-h", "broker", "-t", "field/#", "-t", "debug/#", "-v"]
    depends_on:
      broker:
        condition: service_healthy

  # Field view + MQTT log: http://localhost:8050
  dashboard:
    build: ./services/dashboard
    environment:
      MQTT_HOST: broker
      ZONES: "zone1,zone2,zone3"
      SENSORS_PER_ZONE: "3"
      LOG_TOPICS: "field/#,debug/#"
      CENTRAL_URL: http://central:5000      # all the data (soil, VPD, decisions) comes from central
    ports:
      - "8050:8050"
    depends_on:
      broker:
        condition: service_healthy
      central:
        condition: service_healthy
    restart: unless-stopped

  # Temperature sensors (HTTP, polled by central)
  temperature:
    build: ./services/temperature
    environment:
      NOISE_STD: "0.4"
      SPIKE_PROB: "0.02"
    ports:
      - "5001:5001"
    restart: unless-stopped

  # Central node: soil fusion + air (HTTP pull) -> VPD -> irrigation decision; serves GET /zones to the dashboard
  central:
    build: ./services/central
    environment:
      MQTT_HOST: broker
      ZONES: "zone1,zone2,zone3"
      SENSORS_PER_ZONE: "3"
      TEMPERATURE_URL: http://temperature:5001
      HUMIDITY_URL: http://humidity:5002
      POLL_INTERVAL_S: "5"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      start_period: 10s
      start_interval: 2s
      timeout: 3s
      retries: 3
    depends_on:
      broker:
        condition: service_healthy
      temperature:
        condition: service_started
      humidity:
        condition: service_started
    restart: unless-stopped
